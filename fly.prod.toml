# Fly.io config for the PRODUCTION Tilana admin backend (Nuxt SSR -> Supabase).
# Deploy with: fly deploy --config fly.prod.toml
app = "tilanavantonder-admin-prod"
primary_region = "lhr"   # London, matches Supabase eu-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  # Paystack is not live yet. Change this only during the explicit go-live checklist.
  NUXT_PAYSTACK_ENVIRONMENT = "test"
  NUXT_PAYSTACK_CALLBACK_URL = "https://tilanavantonder.co.za/checkout/complete"
  NUXT_ACCOUNT_BASE_URL = "https://admin.tilanavantonder.co.za"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
