# Fly.io config for the PRODUCTION Tilana admin backend (Nuxt SSR -> Supabase).
# Deploy with: fly deploy --config fly.prod.toml
app = "tilanavantonder-admin-prod"
primary_region = "lhr"   # London, matches Supabase eu-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
