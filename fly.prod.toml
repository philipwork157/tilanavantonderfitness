# Admin (apps/admin-next) on Fly.io: PRODUCTION. https://admin.tilanavantonder.co.za
# Deployed by .github/workflows/deploy-production.yml (manual, from main):
#   flyctl deploy --config fly.prod.toml --remote-only
# Settings come from Fly secrets (see apps/admin-next/.env.example and docs/deploy.md).
app = "tilanavantonder-admin-prod"
primary_region = "fra" # Frankfurt, next to Supabase

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the website reads programs from here, newsletter sending and the
  # 5-minute order checks (unconfirmed payments, PDF email retries, refunds)
  # run inside this server, so it must never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
