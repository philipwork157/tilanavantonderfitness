name: Reconcile Paystack payments

# An external request wakes scale-to-zero Fly apps, unlike an in-process timer.
# GitHub schedules run from the default branch and are best-effort, not a hard SLA.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: paystack-recovery
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      RECOVERY_TOKEN_DEV: ${{ secrets.PAYSTACK_RECOVERY_TOKEN_DEV }}
      RECOVERY_TOKEN_PROD: ${{ secrets.PAYSTACK_RECOVERY_TOKEN_PROD }}
      RECOVERY_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Run configured environment recovery
        shell: bash
        run: |
          if [ "$RECOVERY_ENVIRONMENT" = "prod" ]; then
            RECOVERY_TOKEN="$RECOVERY_TOKEN_PROD"
          else
            RECOVERY_TOKEN="$RECOVERY_TOKEN_DEV"
          fi
          if [ -z "$RECOVERY_TOKEN" ]; then
            echo "Payment recovery is disabled: scheduler token is not configured."
            exit 0
          fi
          if [ "$RECOVERY_ENVIRONMENT" = "prod" ]; then
            RECOVERY_ENDPOINT="https://admin.tilanavantonder.co.za/api/internal/payments/reconcile"
          else
            RECOVERY_ENDPOINT="https://admin-dev.tilanavantonder.co.za/api/internal/payments/reconcile"
          fi
          curl --silent --show-error --fail-with-body --max-time 330 --retry 0 \
            --request POST --header "Authorization: Bearer $RECOVERY_TOKEN" "$RECOVERY_ENDPOINT"
