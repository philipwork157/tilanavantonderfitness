name: Payment recovery (paused)

# The legacy backend and its worker are archived. No schedule or provider
# request may be restored until the replacement backend has been reviewed.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: paystack-recovery
  cancel-in-progress: false

jobs:
  paused:
    name: Recovery is paused during the backend restart
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain the recovery pause
        run: echo '::notice::Payment and email recovery is paused in this restart branch. This workflow makes no requests to the deployed backend.'
