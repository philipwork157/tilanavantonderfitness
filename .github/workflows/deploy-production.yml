name: Build and deploy (production)

# Production never runs on push. Only the public website may be deployed
# during the backend restart; the existing Fly application stays unchanged.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Public website only (admin deployment is paused)
        required: true
        default: public
        type: choice
        options:
          - public
      confirm:
        description: 'Type "deploy" to confirm the production release'
        required: true
        default: ""

concurrency:
  group: production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate request
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch and confirmation for deployments
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$REF_NAME" != "main" ]; then
            echo "Production deployments must be run from the main branch."
            exit 1
          fi
          if [ "$CONFIRM" != "deploy" ]; then
            echo 'Enter "deploy" in the confirmation field.'
            exit 1
          fi
          if [ "$TARGET" != "public" ]; then
            echo 'Admin deployment is paused during the backend restart. Select public.'
            exit 1
          fi

  quality:
    name: Required quality gate
    uses: ./.github/workflows/quality.yml

  build-public:
    name: Build public website
    needs: [validate, quality]
    if: inputs.target == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYMENT_ENVIRONMENT: production
      PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL_PROD }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Validate public environment
        run: node apps/web/scripts/validate-public-deployment-env.mjs
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing.'; exit 1; }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public website
        run: pnpm build:web
      - name: Save public website build
        uses: actions/upload-artifact@v7
        with:
          name: public-website
          path: apps/web/dist/client
          if-no-files-found: error
          retention-days: 1

  admin-paused:
    name: Admin deployment paused
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the backend restart pause
        run: echo '::notice::Admin deployment is paused during the backend restart. The existing Fly application is unchanged.'

  deploy-public:
    name: Deploy public website
    needs: build-public
    if: inputs.target == 'public'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Download public website build
        uses: actions/download-artifact@v7
        with:
          name: public-website
          path: apps/web/dist/client
      - name: Deploy public website to Cloudflare Pages
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist/client
          --project-name=tilanavantonder-website-prod
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
