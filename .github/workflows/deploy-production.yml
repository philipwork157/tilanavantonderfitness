name: Build and deploy (production)

# Production deploys are manual only. Run this existing workflow from main,
# choose public, admin, or both, and enter deploy to confirm. No dev merge needed.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What should be deployed?
        required: true
        default: both
        type: choice
        options:
          - both
          - public
          - admin
      confirm:
        description: 'Type "deploy" to confirm a production release'
        required: true
        default: ""

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public website (prod)
    if: ${{ github.ref_name == 'main' && inputs.confirm == 'deploy' && (inputs.target == 'both' || inputs.target == 'public') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Public, build-time values. Set as repository Variables (Settings ->
      # Secrets and variables -> Actions -> Variables). Use the *_PROD values.
      PUBLIC_CONTACT_API_URL: ${{ secrets.PUBLIC_CONTACT_API_URL_PROD }}
      PUBLIC_NEWSLETTER_API_URL: ${{ secrets.PUBLIC_NEWSLETTER_API_URL_PROD }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web

      - name: Deploy to Cloudflare Pages (prod)
        # Run wrangler via pnpm dlx (isolated temp dir) so it never tries to
        # install into the workspace root. If this project's Pages "production
        # branch" is not `main`, change --branch below.
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist/client
          --project-name=tilanavantonder-website-prod
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: Deploy admin backend (prod)
    if: ${{ github.ref_name == 'main' && inputs.confirm == 'deploy' && (inputs.target == 'both' || inputs.target == 'admin') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      # Also serialise with the existing standalone admin production workflow.
      group: deploy-admin-prod
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Fly.io production token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
        run: test -n "$FLY_API_TOKEN" || { echo '::error::FLY_API_TOKEN_PROD is missing.'; exit 1; }

      - name: Set up flyctl
        # Reuse the SHA-pinned action from the standalone admin workflow.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy admin backend to Fly.io (prod)
        run: flyctl deploy --config fly.prod.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}
