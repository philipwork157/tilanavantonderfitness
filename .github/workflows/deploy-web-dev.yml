name: Deploy web (dev)

# Auto-deploys the public Astro site to the DEV Cloudflare Pages project on
# every push to the `dev` branch. Can also be run manually (workflow_dispatch).

on:
  push:
    branches: [dev]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/deploy-web-dev.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Public, build-time values baked into the static site. Set as repository
      # Variables (Settings -> Secrets and variables -> Actions -> Variables).
      PUBLIC_CONTACT_API_URL: ${{ vars.PUBLIC_CONTACT_API_URL_DEV }}
      PUBLIC_NEWSLETTER_API_URL: ${{ vars.PUBLIC_NEWSLETTER_API_URL_DEV }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY_DEV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web

      - name: Deploy to Cloudflare Pages (dev)
        # Run wrangler via pnpm dlx (isolated temp dir) so it never tries to
        # install into the workspace root. If this project's Pages "production
        # branch" is not `main`, change --branch below.
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist/client
          --project-name=tilanavantonder-website-dev
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
