name: Deploy web (prod)

# PRODUCTION deploys are manual only: Actions -> "Deploy web (prod)" -> Run
# workflow, pick the `main` branch, then type `deploy` in the confirm box.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production release'
        required: true
        default: ""

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Public, build-time values. Set as repository Variables (Settings ->
      # Secrets and variables -> Actions -> Variables). Use the *_PROD values.
      PUBLIC_CONTACT_API_URL: ${{ secrets.PUBLIC_CONTACT_API_URL_PROD }}
      PUBLIC_NEWSLETTER_API_URL: ${{ secrets.PUBLIC_NEWSLETTER_API_URL_PROD }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web

      - name: Deploy to Cloudflare Pages (prod)
        # Run wrangler via pnpm dlx (isolated temp dir) so it never tries to
        # install into the workspace root. If this project's Pages "production
        # branch" is not `main`, change --branch below.
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist/client
          --project-name=tilanavantonder-website-prod
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
