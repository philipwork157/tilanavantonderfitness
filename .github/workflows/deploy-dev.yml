name: Deploy (development)

# Every push to dev: checks, then the admin (Fly.io),
# then the website (Cloudflare Worker), which reads programs from the admin.
#   Admin:   https://admin-dev.tilanavantonder.co.za  (fly.toml)
#   Website: Cloudflare Worker "tilanavantonder-website-dev"
# One-time setup (secrets, variables, domains): docs/deploy.md
on:
  push:
    branches: [dev]
  workflow_dispatch:

# A newer push waits for the running deploy instead of cutting it off.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml

  admin:
    name: Admin (Fly.io)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo '::error::Add the FLY_API_TOKEN_DEV secret (see docs/deploy.md).'; exit 1; }
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      # Database migrations are not part of the deploy: run them by hand first
      # (pnpm --filter @tilana/db db:migrate) when a release includes new ones.
      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

  website:
    name: Website (Cloudflare)
    needs: admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    permissions:
      contents: read
    env:
      DEPLOYMENT_ENVIRONMENT: development
      PUBLIC_API_BASE_URL: https://admin-dev.tilanavantonder.co.za
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY_DEV || secrets.PUBLIC_TURNSTILE_SITE_KEY_DEV }}
      PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      # Visits to the development website show under "My testing" in the admin.
      PUBLIC_SITE_ENVIRONMENT: development
      # Online buying: "true" or "false" (a variable on the GitHub environment).
      # Empty: on for development, off for the live website until switched on.
      PUBLIC_CHECKOUT_ENABLED: ${{ vars.PUBLIC_CHECKOUT_ENABLED }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check website settings
        run: node apps/web/scripts/validate-public-deployment-env.mjs
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Add the CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Add the CLOUDFLARE_ACCOUNT_ID secret.'; exit 1; }
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@tilana/web..."
      - name: Build the website
        run: pnpm --filter @tilana/web build
      - name: Deploy the Cloudflare Worker
        run: pnpm --filter @tilana/web exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
