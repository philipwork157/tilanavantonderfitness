name: Build and deploy (dev)

# Every push to dev checks and deploys the public website.
# The new admin scaffold must not replace the existing Fly application.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  quality:
    name: Required quality gate
    uses: ./.github/workflows/quality.yml

  public:
    name: Public website
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOYMENT_ENVIRONMENT: development
      PUBLIC_API_BASE_URL: ${{ secrets.PUBLIC_API_BASE_URL_DEV }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY_DEV }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Validate public environment
        run: node apps/web/scripts/validate-public-deployment-env.mjs
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID is missing.'; exit 1; }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public website
        run: pnpm build:web
      - name: Deploy public website to Cloudflare Pages
        run: >-
          pnpm dlx wrangler@4 pages deploy apps/web/dist/client
          --project-name=tilanavantonder-website-dev
          --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  admin-paused:
    name: Admin deployment paused
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the backend restart pause
        run: echo '::notice::Admin deployment is paused during the backend restart. The existing Fly application is unchanged.'
