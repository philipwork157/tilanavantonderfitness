name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and public website tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Backend, migration and financial/browser tests are archived during the restart.
    # These checks cover the active scaffold, shared packages and public website only.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint and type checks
        run: pnpm check
      - name: Run public website unit tests
        run: pnpm test
