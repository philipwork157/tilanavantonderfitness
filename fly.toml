# Fly.io config for the Tilana admin backend (Nuxt SSR -> Supabase).
# Deploy from the repo root: `fly deploy`
app = "tilanavantonder-admin-dev"
primary_region = "lhr"   # London, matches Supabase eu-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  NUXT_PAYSTACK_ENVIRONMENT = "test"
  NUXT_PAYSTACK_CALLBACK_URL = "https://website-dev.tilanavantonder.co.za/checkout/complete"
  NUXT_ACCOUNT_BASE_URL = "https://admin-dev.tilanavantonder.co.za"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]


[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
